<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Life Dashboard</h1>
    <button id="theme-toggle" class="btn-ghost" aria-label="Toggle light or dark mode">Dark mode</button>
  </header>

  <main class="grid">
    <!-- Greeting -->
    <section class="card greeting">
      <p id="date" class="muted"></p>
      <p id="time" class="clock"></p>
      <p id="greeting" class="hello"></p>
      <div class="row">
        <input id="name-input" type="text" placeholder="Your name" maxlength="20">
        <button id="name-save" class="btn">Save name</button>
      </div>
    </section>

    <!-- Focus Timer -->
    <section class="card">
      <h2>Focus timer</h2>
      <p id="timer-display" class="clock">25:00</p>
      <div class="row">
        <button id="timer-start" class="btn">Start</button>
        <button id="timer-stop" class="btn-ghost">Stop</button>
        <button id="timer-reset" class="btn-ghost">Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card wide">
      <h2>To-do list</h2>
      <form id="task-form" class="row">
        <input id="task-input" type="text" placeholder="Add a new task" required>
        <button type="submit" class="btn">Add task</button>
      </form>
      <p id="task-error" class="error"></p>
      <ul id="task-list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="card wide">
      <h2>Quick links</h2>
      <form id="link-form" class="row">
        <input id="link-name" type="text" placeholder="Name (e.g. YouTube)" required>
        <input id="link-url" type="text" placeholder="Website (e.g. youtube.com)" required>
        <button type="submit" class="btn">Add link</button>
      </form>
      <div id="link-list" class="links"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
